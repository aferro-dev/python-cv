[project]
name = "python-cv"
version = "0.2.0"
description = "Backend Python e LLM: knowledge base RAG didattica"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.165.0", "pydantic>=2.14.4", "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.54.0", "sqlalchemy[asyncio]>=2.0.40,<3",
  "aiosqlite>=0.21", "asyncpg>=0.30", "alembic>=1.16",
  "pwdlib[argon2]>=0.2", "pyjwt>=2.10", "httpx>=0.28",
  "celery[redis]>=5.6,<6",
  "openai>=2.0", "structlog>=25.0", "prometheus-client>=0.22",
]
[project.optional-dependencies]
local = ["torch>=2.15.0", "transformers[accelerate]>=5.24.1", "numpy>=2.5.5"]
[dependency-groups]
dev = ["basedpyright>=1.40.2", "ruff>=0.17.6", "pytest>=8.3", "pytest-asyncio>=1.0", "pytest-cov>=6", "mypy>=1.15"]
[tool.basedpyright]
venvPath = "."
venv = ".venv"
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
