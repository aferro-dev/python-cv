services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge:local-password@db:5432/knowledge
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LLM_PROVIDER: demo
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["sh", "-c", "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://knowledge:local-password@db:5432/knowledge
      AUTO_CREATE_TABLES: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LLM_PROVIDER: demo
      CELERY_BROKER_URL: redis://redis:6379/0
    command: ["/app/.venv/bin/celery", "-A", "app.tasks:celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "rag"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local-password
      POSTGRES_DB: knowledge
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
  redis-data:
